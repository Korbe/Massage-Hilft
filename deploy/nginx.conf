# nginx-Konfiguration für massage-hilft.at (vite-ssg Build aus dist/)
# Auf dem Server z. B. unter /etc/nginx/sites-available/massage-hilft.at ablegen,
# nach sites-enabled verlinken, dann: sudo nginx -t && sudo systemctl reload nginx
#
# Zertifikatspfade gehen von Let's Encrypt/certbot aus – ggf. an die bestehende Konfiguration anpassen.

# http → https
server {
    listen 80;
    listen [::]:80;
    server_name massage-hilft.at www.massage-hilft.at;
    return 301 https://www.massage-hilft.at$request_uri;
}

# https ohne www → mit www (kanonische Domain)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name massage-hilft.at;

    ssl_certificate     /etc/letsencrypt/live/massage-hilft.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massage-hilft.at/privkey.pem;

    return 301 https://www.massage-hilft.at$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.massage-hilft.at;

    ssl_certificate     /etc/letsencrypt/live/massage-hilft.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massage-hilft.at/privkey.pem;

    root /var/www/massage-hilft.at;
    index index.html;
    charset utf-8;

    # URLs ohne Schrägstrich am Ende (passend zu canonical & sitemap): /heilmassage/ → /heilmassage
    rewrite ^/(.+)/$ /$1 permanent;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # Seiten: /heilmassage → heilmassage/index.html (vorgerendert), unbekannte Pfade → 404.html
    # HTML immer frisch prüfen, damit Updates sofort sichtbar sind.
    # Hinweis: add_header in einer location ersetzt alle Header der server-Ebene – daher hier vollständig.
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Gehashte Build-Dateien (JS, CSS, Schriften, Bilder) dürfen lange gecacht werden
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Video, Poster & Favicon: 1 Woche (Dateinamen nicht gehasht)
    location ~* ^/(video/|favicon\.png$) {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
